backend:
  name: github
  repo: hayden9097-coder/dctech_web
  branch: main

# 로컬에서 관리자 화면을 테스트할 때 사용 (npx decap-server 실행 필요)
local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: "ko"

# 저장 시 커밋 메시지를 한국어로 표시
backend_commit_messages:
  create: "{{collection}} 추가: {{slug}}"
  update: "{{collection}} 수정: {{slug}}"
  delete: "{{collection}} 삭제: {{slug}}"
  uploadMedia: "이미지/파일 업로드: {{path}}"
  deleteMedia: "이미지/파일 삭제: {{path}}"

collections:
  # ======================================================
  # 1. 자주 쓰는 것부터 위에 배치 — 게시글 작성
  # ======================================================
  - name: "news"
    label: "📰 소식 (게시판)"
    label_singular: "게시글"
    description: "공지사항, 보도자료, 제품소식 등을 작성합니다. 작성한 글은 홈 화면과 소식 페이지에 자동으로 표시됩니다."
    folder: "src/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date | date('YYYY.MM.DD')}} · {{title}}"
    sortable_fields: ["date", "title"]
    view_groups:
      - label: "분류별 보기"
        field: category
    fields:
      - label: "레이아웃"
        name: "layout"
        widget: "hidden"
        default: "post.njk"

      - label: "제목"
        name: "title"
        widget: "string"
        hint: "목록과 상세 페이지 상단에 크게 표시됩니다. 예) [공지] 하계 휴무 안내"

      - label: "분류"
        name: "category"
        widget: "select"
        options: ["공지사항", "보도자료", "제품소식", "매뉴얼", "전시회"]
        default: "공지사항"
        hint: "선택한 분류의 탭에 자동으로 들어갑니다. 새 분류가 필요하면 개발자에게 요청하세요."

      - label: "작성일"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
        hint: "이 날짜를 기준으로 최신순 정렬됩니다. 과거 날짜를 넣으면 아래쪽에 표시됩니다."

      - label: "목록에 보일 요약문"
        name: "summary"
        widget: "text"
        hint: "목록에서 제목 아래에 2줄까지 보입니다. 본문 첫 문단을 요약해 60~100자 정도로 적어주세요."

      - label: "대표 이미지 (썸네일)"
        name: "thumbnail"
        widget: "image"
        required: false
        hint: "선택 사항입니다. 넣으면 목록 왼쪽에 사진이 표시됩니다. 가로로 긴 사진(권장 800×450)이 잘 어울립니다."

      - label: "첨부파일"
        name: "attachment"
        widget: "file"
        required: false
        hint: "선택 사항입니다. PDF 등을 올리면 본문 아래에 다운로드 버튼이 생깁니다."

      - label: "본문"
        name: "body"
        widget: "markdown"
        hint: "제목(H2), 목록, 굵게 등은 상단 툴바 버튼으로 넣을 수 있습니다."

  # ======================================================
  - name: "products"
    label: "📦 제품소개"
    label_singular: "제품"
    description: "제품을 추가하면 제품 목록과 홈 화면에 자동으로 카드가 만들어지고, 제품별 상세 페이지가 생성됩니다."
    folder: "src/products"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: ["order", "title"]
    fields:
      - label: "레이아웃"
        name: "layout"
        widget: "hidden"
        default: "product.njk"

      - label: "제품명"
        name: "title"
        widget: "string"
        hint: "예) PumpGuard AI 진단 시스템"

      - label: "제품 분류"
        name: "category"
        widget: "string"
        required: false
        hint: "카드 위에 작은 뱃지로 표시됩니다. 예) AI 진단 솔루션"

      - label: "표시 순서"
        name: "order"
        widget: "number"
        default: 1
        value_type: "int"
        hint: "숫자가 작을수록 목록 앞에 나옵니다. (1이 가장 먼저)"

      - label: "한줄 요약"
        name: "summary"
        widget: "text"
        hint: "제품 목록 카드와 검색결과에 표시됩니다. 이 제품이 무엇을 해결하는지 한 문장으로 적어주세요."

      - label: "대표 이미지"
        name: "image"
        widget: "image"
        required: false
        hint: "선택 사항입니다. 넣지 않으면 기본 아이콘이 표시됩니다. 가로형 사진(권장 1200×900)을 사용하세요."

      - label: "주요 특징"
        name: "features"
        widget: "list"
        required: false
        hint: "상세 페이지 오른쪽 검은 박스에 체크 목록으로 표시됩니다. [+ 추가] 를 눌러 한 줄씩 입력하세요."

      - label: "제품 사양"
        name: "specs"
        widget: "list"
        required: false
        label_singular: "사양 항목"
        summary: "{{fields.label}} — {{fields.value}}"
        hint: "상세 페이지의 사양 표에 들어갑니다. 예) 항목=지원 설비 / 내용=산업용 펌프"
        fields:
          - { label: "항목명", name: "label", widget: "string" }
          - { label: "내용", name: "value", widget: "string" }

      - label: "제품 카탈로그 (PDF)"
        name: "brochure"
        widget: "file"
        required: false
        hint: "선택 사항입니다. 올리면 상세 페이지에 '카탈로그 다운로드' 버튼이 생깁니다."

      - label: "상세 설명"
        name: "body"
        widget: "markdown"
        hint: "제품 개요, 적용 현장, 도입 효과 등을 자유롭게 작성하세요."

  # ======================================================
  - name: "cases"
    label: "📈 도입 사례"
    label_singular: "사례"
    description: "고객사 도입 성과를 '도입 전 / 도입 후' 수치로 비교해 보여줍니다."
    folder: "src/cases"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: ["order", "title"]
    fields:
      - { label: "레이아웃", name: "layout", widget: "hidden", default: "case.njk" }
      - label: "사례 제목"
        name: "title"
        widget: "string"
        hint: "예) 화학 플랜트 냉각수 순환 펌프"
      - label: "태그"
        name: "tag"
        widget: "string"
        hint: "카드 위 뱃지에 표시됩니다. 예) CASE 03 · 정수 처리장"
      - label: "표시 순서"
        name: "order"
        widget: "number"
        default: 1
        value_type: "int"
        hint: "숫자가 작을수록 앞에 표시됩니다."
      - label: "한줄 요약"
        name: "summary"
        widget: "string"
        hint: "이 사례로 무엇이 개선되었는지 한 문장으로 적어주세요."
      - label: "도입 전 지표"
        name: "before"
        widget: "list"
        label_singular: "지표"
        summary: "{{fields.label}} — {{fields.value}}"
        hint: "2개 정도가 보기 좋습니다. 예) 항목=연간 불시 정지 / 값=연 4회"
        fields:
          - { label: "항목명", name: "label", widget: "string" }
          - { label: "값", name: "value", widget: "string" }
      - label: "도입 후 지표"
        name: "after"
        widget: "list"
        label_singular: "지표"
        summary: "{{fields.label}} — {{fields.value}}"
        hint: "'도입 전'과 같은 항목으로 맞춰야 비교가 잘 보입니다."
        fields:
          - { label: "항목명", name: "label", widget: "string" }
          - { label: "값", name: "value", widget: "string" }
      - label: "본문"
        name: "body"
        widget: "markdown"
        hint: "도입 배경 → 도전 과제 → 접근 방법 → 도입 결과 순서로 쓰면 읽기 좋습니다."

  # ======================================================
  # 2. 페이지 콘텐츠 수정
  # ======================================================
  - name: "home"
    label: "🏠 홈 화면 편집"
    description: "홈페이지 첫 화면의 문구와 숫자를 수정합니다."
    files:
      - file: "src/_data/home.json"
        label: "홈 화면"
        name: "home"
        fields:
          - label: "상단 작은 뱃지 문구"
            name: "hero_badge"
            widget: "string"
            hint: "제목 위 파란 알약 모양 안의 영문 문구입니다."

          - label: "메인 제목 (1번째 줄)"
            name: "hero_title_line1"
            widget: "string"
            hint: "흰색으로 표시됩니다. 예) 설비가 멈추기 전에,"

          - label: "메인 제목 (2번째 줄 · 파란 강조)"
            name: "hero_title_line2"
            widget: "string"
            hint: "파란 그라데이션으로 강조됩니다. 예) AI가 먼저 진단합니다."

          - label: "메인 제목 아래 설명문"
            name: "hero_subtitle"
            widget: "text"
            hint: "2~3문장 정도가 적당합니다."

          - label: "주 버튼 문구"
            name: "cta_primary_label"
            widget: "string"
            hint: "파란색 버튼입니다."
          - label: "주 버튼 링크"
            name: "cta_primary_url"
            widget: "string"
            hint: "슬래시(/)로 시작하는 주소를 넣으세요. 예) /contact/"
          - label: "보조 버튼 문구"
            name: "cta_secondary_label"
            widget: "string"
          - label: "보조 버튼 링크"
            name: "cta_secondary_url"
            widget: "string"

          - label: "숫자 지표 (3개)"
            name: "stats"
            widget: "list"
            label_singular: "지표"
            summary: "{{fields.value}}{{fields.suffix}} — {{fields.label}}"
            hint: "⚠️ 근거 있는 실제 수치만 사용하세요. 예) 수치=98.4 / 기호=% / 설명=이상 진단 정확도"
            fields:
              - { label: "수치", name: "value", widget: "string" }
              - { label: "단위·기호", name: "suffix", widget: "string" }
              - { label: "설명", name: "label", widget: "string" }

          - label: "소개 제목"
            name: "intro_title"
            widget: "string"
          - label: "소개 본문"
            name: "intro_body"
            widget: "text"

          - label: "바로가기 카드"
            name: "highlight_cards"
            widget: "list"
            label_singular: "카드"
            summary: "{{fields.title}}"
            hint: "홈 중간에 표시되는 바로가기 카드입니다. 순서를 드래그해 바꿀 수 있습니다."
            fields:
              - label: "아이콘"
                name: "icon"
                widget: "select"
                options:
                  - { label: "사람 (회사소개)", value: "about" }
                  - { label: "번개 (솔루션)", value: "solutions" }
                  - { label: "그래프 (도입사례)", value: "cases" }
                  - { label: "상자 (제품)", value: "products" }
                  - { label: "다운로드 (자료실)", value: "downloads" }
                  - { label: "신문 (소식)", value: "news" }
              - { label: "카드 제목", name: "title", widget: "string" }
              - { label: "카드 설명", name: "desc", widget: "text" }
              - { label: "링크 문구", name: "link_label", widget: "string" }
              - { label: "링크 주소", name: "link_url", widget: "string", hint: "예) /products/" }

          - { label: "배너 제목", name: "cta_banner_title", widget: "string" }
          - { label: "배너 설명", name: "cta_banner_desc", widget: "text" }
          - { label: "배너 버튼 문구", name: "cta_banner_button", widget: "string" }

  # ======================================================
  - name: "about"
    label: "🏢 회사소개 편집"
    files:
      - file: "src/_data/about.json"
        label: "회사소개"
        name: "about"
        fields:
          - { label: "상단 영문 라벨", name: "eyebrow", widget: "string", hint: "예) ABOUT US" }
          - { label: "페이지 제목", name: "title", widget: "string" }
          - { label: "회사 소개문", name: "intro", widget: "text", hint: "회사가 무엇을 하는 곳인지 4~6문장으로 설명해주세요." }
          - { label: "비전 문구 (인용구)", name: "quote", widget: "text", hint: "전구 아이콘 옆에 큰따옴표로 표시됩니다." }
          - { label: "인용 출처", name: "quote_source", widget: "string", hint: "예) — DCTech 대표이사" }

          - { label: "핵심가치 섹션 제목", name: "values_title", widget: "string" }
          - label: "핵심가치"
            name: "values"
            widget: "list"
            label_singular: "가치"
            summary: "{{fields.title}}"
            hint: "4개일 때 2×2로 가장 보기 좋습니다."
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "설명", name: "desc", widget: "text" }

          - { label: "조직도 섹션 제목", name: "org_title", widget: "string", required: false }
          - { label: "조직도 설명", name: "org_desc", widget: "text", required: false }
          - label: "조직도 이미지"
            name: "org_image"
            widget: "image"
            required: false
            hint: "비워두면 조직도 섹션이 통째로 숨겨집니다."

          - { label: "연혁 섹션 제목", name: "history_title", widget: "string" }
          - label: "회사 연혁"
            name: "history"
            widget: "list"
            label_singular: "연혁"
            summary: "{{fields.date}} — {{fields.title}}"
            hint: "위에서부터 순서대로 표시됩니다. 가장 마지막 항목이 '현재'로 강조됩니다."
            fields:
              - { label: "시기", name: "date", widget: "string", hint: "예) 2021.02 또는 NOW" }
              - { label: "제목", name: "title", widget: "string" }
              - { label: "설명", name: "desc", widget: "text" }

  # ======================================================
  - name: "solutions"
    label: "⚡ 핵심 솔루션 편집"
    files:
      - file: "src/_data/solutions.json"
        label: "핵심 솔루션"
        name: "solutions"
        fields:
          - { label: "상단 영문 라벨", name: "eyebrow", widget: "string" }
          - { label: "페이지 제목", name: "title", widget: "string" }
          - { label: "페이지 설명문", name: "subtitle", widget: "text" }

          - { label: "솔루션 흐름도 제목", name: "diagram_title", widget: "string", required: false }
          - { label: "솔루션 흐름도 설명", name: "diagram_desc", widget: "text", required: false }
          - label: "솔루션 흐름도 이미지"
            name: "diagram_image"
            widget: "image"
            required: false
            hint: "전체 솔루션 구조를 보여주는 가로형 다이어그램입니다. 비워두면 해당 섹션이 통째로 숨겨집니다."

          - label: "핵심 기술"
            name: "items"
            widget: "list"
            label_singular: "기술"
            summary: "{{fields.title}}"
            fields:
              - label: "아이콘"
                name: "icon"
                widget: "select"
                options:
                  - { label: "번개 (AI)", value: "bolt" }
                  - { label: "원통 (데이터베이스)", value: "database" }
                  - { label: "화살표 (데이터 변환)", value: "swap" }
              - { label: "기술명", name: "title", widget: "string" }
              - label: "설명 이미지"
                name: "image"
                widget: "image"
                required: false
                hint: "해당 기술의 화면 예시나 개념도입니다. 비워두면 이미지 없이 기능 목록만 표시됩니다."
              - { label: "한줄 요약", name: "summary", widget: "string" }
              - { label: "상세 설명", name: "detail", widget: "text" }
              - label: "주요 기능"
                name: "features"
                widget: "list"
                hint: "오른쪽 검은 박스에 체크 목록으로 표시됩니다."
          - { label: "프로세스 섹션 제목", name: "process_title", widget: "string" }
          - label: "진단 프로세스"
            name: "process"
            widget: "list"
            label_singular: "단계"
            summary: "{{fields.step}} {{fields.title}}"
            fields:
              - { label: "단계 번호", name: "step", widget: "string", hint: "예) 01" }
              - { label: "단계 제목", name: "title", widget: "string" }
              - { label: "설명", name: "desc", widget: "text" }

  # ======================================================
  - name: "downloads"
    label: "📄 자료실 편집"
    files:
      - file: "src/_data/downloads.json"
        label: "자료실"
        name: "downloads"
        fields:
          - { label: "상단 영문 라벨", name: "eyebrow", widget: "string" }
          - { label: "페이지 제목", name: "title", widget: "string" }
          - { label: "안내문", name: "intro", widget: "text" }
          - label: "자료 목록"
            name: "items"
            widget: "list"
            label_singular: "자료"
            summary: "{{fields.title}}"
            hint: "파일을 올리지 않으면 '준비중'으로 표시됩니다."
            fields:
              - { label: "자료명", name: "title", widget: "string" }
              - { label: "설명", name: "desc", widget: "text" }
              - { label: "분류", name: "kind", widget: "string", hint: "예) 제품 카탈로그, 회사소개" }
              - { label: "파일 (PDF 등)", name: "file", widget: "file", required: false, hint: "올리면 다운로드 버튼이 활성화됩니다." }
              - { label: "파일 정보 표시", name: "filesize", widget: "string", required: false, hint: "예) PDF, 2.4MB — 방문자에게 참고용으로 보입니다." }

  # ======================================================
  - name: "contact"
    label: "✉️ 문의 페이지 편집"
    files:
      - file: "src/_data/contact.json"
        label: "문의 페이지"
        name: "contact"
        fields:
          - { label: "상단 영문 라벨", name: "eyebrow", widget: "string" }
          - { label: "페이지 제목", name: "title", widget: "string" }
          - { label: "안내문", name: "intro", widget: "text" }
          - { label: "개인정보 동의 문구", name: "privacy_note", widget: "text", hint: "폼 하단 체크박스 옆에 표시됩니다." }
          - { label: "제출 버튼 문구", name: "submit_label", widget: "string" }
          - { label: "FAQ 섹션 제목", name: "faq_title", widget: "string" }
          - label: "자주 묻는 질문"
            name: "faq"
            widget: "list"
            label_singular: "질문"
            summary: "{{fields.q}}"
            fields:
              - { label: "질문", name: "q", widget: "string" }
              - { label: "답변", name: "a", widget: "text" }

  # ======================================================
  # 3. 사이트 전역 설정 (자주 바뀌지 않음)
  # ======================================================
  - name: "navigation"
    label: "🧭 메뉴 구성"
    description: "상단 메뉴(GNB)와 하단 푸터 메뉴를 편집합니다. 잘못 수정하면 메뉴가 깨질 수 있으니 주의하세요."
    files:
      - file: "src/_data/navigation.json"
        label: "메뉴"
        name: "navigation"
        fields:
          - { label: "우측 버튼 문구", name: "cta_label", widget: "string" }
          - { label: "우측 버튼 링크", name: "cta_url", widget: "string" }
          - { label: "대표번호 표시", name: "show_phone", widget: "boolean", default: true, hint: "끄면 상단 우측 전화번호가 숨겨집니다." }
          - label: "상단 메뉴"
            name: "menu"
            widget: "list"
            label_singular: "메뉴"
            summary: "{{fields.label}}"
            hint: "드래그해서 순서를 바꿀 수 있습니다. 하위 메뉴가 있으면 마우스를 올렸을 때 펼쳐집니다."
            fields:
              - { label: "메뉴 이름", name: "label", widget: "string" }
              - { label: "링크 주소", name: "url", widget: "string", hint: "예) /products/" }
              - label: "하위 메뉴 (드롭다운)"
                name: "children"
                widget: "list"
                required: false
                label_singular: "하위 메뉴"
                summary: "{{fields.label}}"
                hint: "비워두면 드롭다운 없이 단일 메뉴가 됩니다."
                fields:
                  - { label: "이름", name: "label", widget: "string" }
                  - { label: "링크 주소", name: "url", widget: "string" }
          - label: "푸터 메뉴"
            name: "footer_columns"
            widget: "list"
            label_singular: "푸터 열"
            summary: "{{fields.title}}"
            fields:
              - { label: "열 제목", name: "title", widget: "string" }
              - label: "링크 목록"
                name: "links"
                widget: "list"
                summary: "{{fields.label}}"
                fields:
                  - { label: "이름", name: "label", widget: "string" }
                  - { label: "링크 주소", name: "url", widget: "string" }

  # ======================================================
  - name: "settings"
    label: "⚙️ 사이트 기본정보"
    description: "회사명, 로고, 주소, 연락처 등 사이트 전체에 적용되는 정보입니다."
    files:
      - file: "src/_data/site.json"
        label: "기본정보"
        name: "site"
        fields:
          - { label: "회사명 (국문)", name: "company_name_kr", widget: "string" }
          - { label: "회사명 (영문)", name: "company_name_en", widget: "string" }
          - { label: "사이트 주소", name: "url", widget: "string", hint: "⚠️ 검색엔진·SNS 공유에 사용됩니다. 도메인 변경 시에만 수정하세요. 끝에 / 를 넣지 마세요." }
          - { label: "로고 이미지", name: "logo", widget: "image", hint: "헤더·푸터에 표시됩니다. 배경이 투명한 PNG를 권장합니다." }
          - { label: "파비콘", name: "favicon", widget: "image", hint: "브라우저 탭에 표시되는 작은 아이콘입니다. 정사각형 PNG를 권장합니다." }
          - { label: "SNS 공유 이미지", name: "og_image", widget: "image", hint: "카카오톡·링크드인 등에 링크를 공유할 때 표시되는 이미지입니다. 권장 1200×630." }
          - { label: "사이트 설명 (검색엔진용)", name: "meta_description", widget: "text", hint: "구글 검색 결과에 표시되는 문구입니다. 80~150자를 권장합니다." }
          - { label: "주소", name: "address", widget: "string" }
          - { label: "대표번호", name: "phone", widget: "string", hint: "헤더 우측과 푸터에 표시됩니다." }
          - { label: "보조 번호", name: "phone2", widget: "string" }
          - { label: "이메일", name: "email", widget: "string" }
          - { label: "저작권 연도", name: "copyright_year", widget: "string" }
